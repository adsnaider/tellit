[package]
name = "tellit-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tellit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
anyhow = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"
