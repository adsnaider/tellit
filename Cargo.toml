[workspace]
members = [
    ".",
    "crates/tellit-types",
    "crates/tellit-ui",
]
default-members = [
    ".",
    "crates/tellit-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0"
tellit-types = { path = "crates/tellit-types" }
thiserror = { version = "2.0", default-features = false }
wasm-bindgen = "=0.2.129"

[package]
name = "tellit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tellit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
mime_guess = "2.0"
open = "5.4"
rust-embed = { version = "8.14", features = ["debug-embed"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tellit-types.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio = { version = "1.44", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3.17"
