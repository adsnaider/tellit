[package]
name = "tellit-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tellit-types.workspace = true
thiserror = { workspace = true, features = ["std"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventSource",
    "Headers",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Range",
    "RequestInit",
    "Response",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Selection",
    "Storage",
    "SubmitEvent",
    "Window",
    "console",
] }
yaml-rust = "0.4"
