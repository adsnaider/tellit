[package]
name = "tellit-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
tellit-types.workspace = true
thiserror = { workspace = true, features = ["std"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "Event",
    "EventSource",
    "Headers",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "RequestInit",
    "Response",
    "Selection",
    "Storage",
    "SubmitEvent",
    "Window",
] }
